<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EAEE; --surface:#FFF; --ink:#15171C; --muted:#767C86; --rule:#D9DDE3; --wire:#C8CDD4;
  --accent:#3D3A9E; --accent-bg:#EDECF8;
  --amber:#8A5A12; --amber-bg:#FAF1E0;
  --rust:#9B2F26; --rust-bg:#FBEBE9;
  --green:#1E6B4E; --green-bg:#E7F2ED;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:24px 22px 70px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.src{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px}
.src.live{background:var(--green-bg);color:var(--green)}
.src.demo{background:var(--amber-bg);color:var(--amber)}

.cols{display:grid;grid-template-columns:340px 316px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1120px){.cols{grid-template-columns:320px minmax(0,1fr)}.pane-detail{grid-column:1/-1}}
@media (max-width:760px){.cols{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px}
.card + .card{margin-top:12px}
.cap{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;margin:0 0 11px}
[hidden]{display:none !important}

details.card{padding:0}
details.card > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary:hover{color:var(--ink)}
details.card > summary .chev{transition:transform .15s ease;font-size:14px;line-height:1}
details.card[open] > summary .chev{transform:rotate(90deg)}
details.card[open] > summary{border-bottom:1px solid var(--rule)}
details.card > .body{padding:14px 16px 16px}
.sum{font-family:var(--ui);font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;margin-left:8px}
details.card[open] > summary .sum{display:none}
.more{font-family:var(--mono);font-size:10px;color:var(--muted);background:none;border:1px dashed var(--rule);border-radius:2px;padding:6px 8px;cursor:pointer;width:100%;margin-top:10px}
.more:hover{color:var(--ink);border-color:var(--muted)}

details.warns{margin-bottom:6px}
details.warns > summary{list-style:none;cursor:pointer;font-size:12.5px;padding:8px 10px;border-radius:3px;background:var(--amber-bg);color:var(--amber);display:flex;gap:7px;align-items:center}
details.warns > summary::-webkit-details-marker{display:none}
details.warns > summary .chev{margin-left:auto;transition:transform .15s ease;font-size:14px;line-height:1}
details.warns[open] > summary .chev{transform:rotate(90deg)}
details.warns[open] > summary{border-radius:3px 3px 0 0}
details.warns .flag{border-radius:0;margin-bottom:0;border-top:1px solid rgba(138,90,18,.16)}
details.warns .flag:last-child{border-radius:0 0 3px 3px}

details.slots > summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:16px;padding:4px 0}
details.slots > summary::-webkit-details-marker{display:none}
details.slots > summary:hover{color:var(--ink)}
label.f{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px}
select,input[type=text]{width:100%;font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:7px 9px}
select:focus-visible,input:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{height:11px}

.pick{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--rule);cursor:pointer}
.pick:first-of-type{border-top:none}
.pick input{margin:2px 0 0;accent-color:var(--accent)}
.pick .l1{font-size:13px;font-weight:500;line-height:1.35}
.pick .l2{font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.pick.off{opacity:.3;cursor:not-allowed}
.pick.off .why{display:block}
.why{display:none;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bars{display:flex;gap:2px;margin-top:4px}
.bars i{width:4px;height:9px;border-radius:1px;background:var(--rule);display:block}
.bars i.on{background:var(--accent)}
.scope{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--muted)}

.flag{display:flex;gap:7px;font-size:12.5px;padding:8px 10px;border-radius:3px;margin-bottom:6px;line-height:1.4}
.flag.err{background:var(--rust-bg);color:var(--rust)}
.flag.warn{background:var(--amber-bg);color:var(--amber)}
.flag.ok{background:var(--green-bg);color:var(--green)}
.flag .ic{font-family:var(--mono);font-weight:500}
.flag b{font-weight:600}

.page{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:10px}
.thesis{font-size:11.5px;color:var(--muted);text-align:center;padding:7px 8px 9px;border-bottom:1px dashed var(--rule);margin-bottom:8px;line-height:1.35}
.sect{position:relative;border:1px solid transparent;border-radius:3px;padding:8px;margin-bottom:5px;cursor:pointer;background:#FAFBFC}
.sect:hover{background:#F2F4F7}
.sect.sel{border-color:var(--accent);background:var(--accent-bg)}
.sect .idx{position:absolute;left:-24px;top:9px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.page{padding-left:34px}
.slotlabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin:0 0 3px}
.kindlabel{font-family:var(--mono);font-size:8px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;float:right}
.bar{background:var(--wire);border-radius:1px;height:6px;margin-bottom:4px}
.bar.t{height:9px}
.bar.s{height:4px;opacity:.6}
.box{background:var(--wire);border-radius:2px;opacity:.55}
.btn{background:var(--accent);opacity:.5;height:9px;width:38px;border-radius:2px;margin-top:5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.rowsp{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center}
.num{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--wire);line-height:1}
.miss{position:absolute;right:7px;top:7px;font-family:var(--mono);font-size:8.5px;color:var(--amber);background:var(--amber-bg);padding:1px 4px;border-radius:2px}
.disabled-slot{opacity:.35}
.sect-divider{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:4px 0;margin:2px 0}
.timeline-steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.timeline-step{text-align:center}
.timeline-step .box{height:20px;margin-bottom:3px}
.tab-row{display:flex;gap:3px;margin-bottom:5px}
.tab-pill{background:var(--wire);border-radius:2px 2px 0 0;height:5px;flex:1;opacity:.6}
.tab-pill:first-child{opacity:1}
.accordion-item{display:flex;gap:4px;align-items:center;margin-bottom:3px}
.accordion-item .dot{width:5px;height:5px;border-radius:50%;background:var(--wire)}
.accordion-item .bar{flex:1;margin-bottom:0}
.benefit-item{display:flex;gap:5px;align-items:start;margin-bottom:4px}
.benefit-item .icon-box{width:14px;height:14px;border-radius:2px;background:var(--wire);opacity:.6;flex-shrink:0}
.faq-item{margin-bottom:4px;padding-left:8px;border-left:2px solid var(--wire)}

.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
.kv dt{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.slot{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-bg);border-radius:2px;padding:2px 6px;margin:0 4px 4px 0;display:inline-block}
.empty{font-size:13px;color:var(--muted);padding:22px 4px}
.foot{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
button.go{font-family:var(--ui);font-size:14px;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:3px;padding:9px 16px;cursor:pointer}
button.go:disabled{background:#B9BCC4;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.json-out{font-family:var(--mono);font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:14px;border-radius:4px;overflow-x:auto;white-space:pre;margin-top:12px;max-height:400px;overflow-y:auto;display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Outline Builder</h1>
  <span class="sub" id="prodname"></span>
  <span class="src demo" id="source">demo data</span>
</header>

<div class="cols">

  <!-- 1. inputs -->
  <div>
    <details class="card" id="setup" open>
      <summary><span>Setup<span class="sum" id="setupsum"></span></span><span class="chev">&#8250;</span></summary>
      <div class="body">
        <div class="two">
          <div><label class="f" for="prod">Product</label><select id="prod"></select></div>
          <div><label class="f" for="arch">Archetype</label><select id="arch">
            <option value="listicle_a">Listicle advertorial</option>
            <option value="standard">Standard lander</option>
          </select></div>
        </div>
        <div class="sp"></div>
        <div class="two">
          <div><label class="f" for="aw">Awareness</label><select id="aw"></select></div>
          <div></div>
        </div>
        <div class="sp"></div>
        <label class="f" for="idea">Controlling idea</label>
        <input type="text" id="idea" value="A multivitamin you can actually verify">
        <p class="hint" id="archnote"></p>
      </div>
    </details>

    <div class="card">
      <p class="cap"><span>Claims</span><span id="ccount"></span></p>
      <div id="claims"></div>
      <button type="button" class="more" id="showall" hidden></button>
    </div>

    <details class="card" id="objwrap">
      <summary><span>Objections<span class="sum" id="objsum"></span></span><span class="chev">&#8250;</span></summary>
      <div class="body"><div id="objs"></div></div>
    </details>
  </div>

  <!-- 2. page -->
  <div>
    <div class="cap" style="padding:0 2px"><span>Page</span><span id="meta"></span></div>
    <div class="page" id="page"></div>
  </div>

  <!-- 3. detail -->
  <div class="pane-detail">
    <div id="flags"></div>
    <div class="card">
      <p class="cap"><span id="dtitle">Slot</span><span id="dpos"></span></p>
      <div id="detail"><p class="empty">Click a section in the page to inspect it.</p></div>
    </div>
    <div class="foot">
      <button class="go" id="gen">Generate copy</button>
      <span class="note" id="gnote"></span>
    </div>
    <pre class="json-out" id="jsonout"></pre>
  </div>

</div>
</div>

<script>
/* ============ CONFIG ============ */
var ENDPOINT = "";   /* paste Apps Script /exec URL */

var STAGE_LABELS = {
  unaware:"Cold and unaware", problem:"Problem aware", solution:"Solution aware",
  product:"Product aware", most:"Most aware"
};
var STOP = " a an the and or of to for in on with is are it that this you your we our not no do does ".split(" ");

/* ============ ARCHETYPE MANIFESTS ============
   From 04-outline-logic.md and 07-section-audit.md.
   Every slot is a real metafield key. Every section_type is a real theme type.
   Nothing here is invented. */

var ARCHETYPES = {
  listicle_a: {
    name: "Listicle advertorial",
    description: "The advertorial with five numbered listicle blocks. Opens with page.title as H1.",
    /* Max claims equals the number of numbered block keys */
    max_claims: 5,
    slots: [
      { key:"page.title", kind:"native", section_type:"rich-text", role:"Hook",
        role_intent:"Headline must contain the number of reasons. The page opens as an article.",
        content:"controlling_idea", needs_media:false,
        fields:["title"] },
      { key:"page.content", kind:"native", section_type:"rich-text", role:"Setup",
        role_intent:"The setup. Say why this matters now, in two sentences. No claims.",
        content:"none", needs_media:false,
        fields:["content"] },
      { key:"custom.note", kind:"single", section_type:"rich-text", role:"Callout",
        role_intent:"A short callout or note. Optional.",
        content:"none", needs_media:false, optional:true,
        fields:["note"] },
      { key:"metabject_author", kind:"single", section_type:"temp-author", role:"Byline",

        role:"List item 2", role_intent:"One numbered reason, self contained, no forward references.",

        fields:["badge_text","heading","body_text","cta_label","cta_link","image"] },
      { key:"listicle_a_listicle_block_3", kind:"numbered", section_type:"temp-listicle-img-txt-block",

        fields:["badge_text","heading","body_text","cta_label","cta_link","image"] },
      { key:"listicle_a_listicle_block_4", kind:"numbered", section_type:"temp-listicle-img-txt-block",

        fields:["badge_text","heading","body_text","cta_label","cta_link","image"] },
      { key:"section_2_bts_2_accordtion", kind:"repeater", section_type:"accordion-block",
        role:"Handle objections", role_intent:"Name the doubt in their words, then answer it plainly.",
        content:"objections", needs_media:false,
        fields:["header","subheader","image","nutrient_deficiencies[]"] },
      { key:"timeline", kind:"single", section_type:"timeline-section",
        role:"Mechanism", role_intent:"Three steps showing how it works over time.",
        content:"none", needs_media:true,
        fields:["heading_line_1","heading_line_2","timeline_1","timeline_2","timeline_3"] },
      { key:"last_module", kind:"single", section_type:"temp-replo-hero",
        role:"Close", role_intent:"Restate the single idea and ask for the order.",
        content:"close", needs_media:true,
        fields:["header","body","cta_copy","image"] },
      { key:"main_product_for_purchase", kind:"fixed", section_type:"standalone-product",
        role:"Purchase", role_intent:"Product reference. Set once.",
        content:"none", needs_media:false,
        fields:["product"] }
    ]
  },
  standard: {
    name: "Standard lander",
    description: "The temp-replo-hero lander. Opens with the hero section bound to the strongest claim.",
    max_claims: null, /* no hard max, overflow goes to benefits repeater */
    slots: [
      { key:"section_temp_replo_hero", kind:"single", section_type:"temp-replo-hero",
        role:"Hero", role_intent:"Open with the strongest claim. Say the pain in their words before naming the product.",
        content:"top_claim", needs_media:true,
        fields:["header","body","cta_copy","image","mobile_image","rotating_badges","creator_image","creator_handle","creator_quote"] },
      { key:"rotating_marquee", kind:"single", section_type:"temp-marquee",
        role:"Marquee", role_intent:"Rotating announcement ticker. Chrome, rarely varies.",
        content:"none", needs_media:false,
        fields:["marquee_text_one","marquee_text_two","marquee_text_three","section_enabled"] },
      { key:"section_statistics.stat_1", kind:"numbered", section_type:"temp-stats",
        role:"Stat 1", role_intent:"One proof point with a number, a percentage, or a concrete fact.",
        content:"claim", needs_media:false, number:1, group:"section_statistics",
        fields:["icon","percentage","gray_subtext","black_text"] },
      { key:"section_statistics.stat_2", kind:"numbered", section_type:"temp-stats",
        role:"Stat 2", role_intent:"One proof point with a number, a percentage, or a concrete fact.",
        content:"claim", needs_media:false, number:2, group:"section_statistics",

      { key:"section_statistics.stat_3", kind:"numbered", section_type:"temp-stats",

      { key:"section_2_bts_2_accordtion", kind:"repeater", section_type:"accordion-block",

      { key:"section_science_tabs", kind:"repeater", section_type:"temp-science-module",
        role:"Mechanism", role_intent:"Explain why the fix works, once, in plain terms. One tab per angle.",
        content:"claims", needs_media:true,
        fields:["header","tabs[]"] },
      { key:"section_image_with_text", kind:"single", section_type:"image-with-text",
        role:"Prove the benefit", role_intent:"One reason to believe, driven all the way home.",
        content:"claim", needs_media:true,
        fields:["header","body","cta_text","image"] },
      { key:"section_benefits", kind:"repeater", section_type:"temp-benefits-split",
        role:"Benefits", role_intent:"Remaining claims as a list of benefits.",
        content:"claims", needs_media:false,
        fields:["header","body","button_label","button_cta","benefits[]"] },
      { key:"section_bts_3_accodtion", kind:"repeater", section_type:"accordion-block",
        role:"Handle objections", role_intent:"Name the doubt in their words, then answer it plainly.",
        content:"objections", needs_media:false,
        fields:["header","subheader","image","nutrient_deficiencies[]"] },
      { key:"section_faq", kind:"repeater", section_type:"faq",
        role:"FAQ", role_intent:"Common questions from people who almost bought but did not.",
        content:"objections", needs_media:false,
        fields:["list_of_faq_blocks[]"] },
      { key:"last_module", kind:"single", section_type:"temp-replo-hero",
        role:"Close", role_intent:"Restate the single idea and ask for the order. H2, not H1.",
        content:"close", needs_media:true,
        fields:["header","body","cta_copy","image"] },
      { key:"main_product_for_purchase", kind:"fixed", section_type:"standalone-product",
        role:"Purchase", role_intent:"Product reference. Set once.",
        content:"none", needs_media:false,
        fields:["product"] }
    ]
  }
};

/* ============ DEMO DATA ============ */
var DEMO = {
products:[

   one_liner:"Third party tested daily multivitamin"}
],
claims:[

  {claim_id:"cl_05",product_id:"meridian_daily",scope:"reason",strength:3,asset_id:"as_04",

  {claim_id:"cl_07",product_id:"meridian_daily",scope:"spec",strength:2,asset_id:"",
   awareness:["product","most"],kills_objection:[],

function esc(s){
  return String(s||'').replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});
}
function fl(f){
  return '<div class="flag '+f[0]+'"><span class="ic">'+
    (f[0]==='err'?'!':f[0]==='warn'?'?':'\u2713')+'</span><span><b>'+f[1]+'.</b> '+f[2]+'</span></div>';
}
function bars(n,max){
  var h='';for(var i=1;i<=max;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';
  return '<span class="bars">'+h+'</span>';
}
function tokens(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'')
    .split(/\s+/).filter(function(w){return w.length>2 && STOP.indexOf(' '+w+' ')<0});
}
function myClaims(){
  return (DATA.claims||[]).filter(function(c){return c.product_id===$('prod').value});
}
function myObjs(){

}

/* ---- boot ---- */

  $('prod').innerHTML = (d.products||[]).map(function(p){

/* ---- paint claim and objection pickers ---- */
function paintProduct(){
  var p = (DATA.products||[]).filter(function(x){return x.product_id===$('prod').value})[0];
  $('prodname').textContent = p ? p.one_liner : '';

  $('claims').innerHTML = myClaims().slice()
    .sort(function(a,b){return b.strength-a.strength || a.claim_id.localeCompare(b.claim_id)})
    .map(function(c,i){
      return '<label class="pick" data-id="'+c.claim_id+'">'+
        '<input type="checkbox" value="'+c.claim_id+'"'+(i<4?' checked':'')+'>'+
        '<span><span class="l1">'+esc(c.feature)+'</span>'+
          (c.benefit?'<span class="l2">'+esc(c.benefit)+'</span>':'')+
          '<span class="why"></span></span>'+
        '<span class="right">'+
          '<span class="scope">'+esc(c.scope)+'</span>'+
          bars(c.strength,5)+'</span></label>';
    }).join('');

  $('objs').innerHTML = myObjs().slice()
    .sort(function(a,b){return b.severity-a.severity || a.objection_id.localeCompare(b.objection_id)})
    .map(function(o,i){
      return '<label class="pick" data-id="'+o.objection_id+'">'+
        '<input type="checkbox" value="'+o.objection_id+'"'+(i<2?' checked':'')+'>'+
        '<span><span class="l1">'+esc(o.objection)+'</span>'+
          '<span class="l2 scope">'+esc(o.category)+'</span></span>'+
        '<span class="right">'+bars(o.severity,5)+'</span></label>';
    }).join('');

  document.querySelectorAll('#claims input,#objs input').forEach(function(c){
    c.addEventListener('change',function(){
      SEL = null;
      if(!TOUCHED){TOUCHED=true; $('setup').open=false}
      build();
    });
  });
}

/* ---- resolve asset for a claim ---- */
function resolveAsset(claim, usedAssets){
  if(!claim) return '';
  /* 1. claim's own asset */
  if(claim.asset_id && !usedAssets[claim.asset_id]) return claim.asset_id;
  /* 2. product + orientation match from assets table */
  var prod = $('prod').value;
  var match = (DATA.assets||[]).filter(function(a){
    return !usedAssets[a.asset_id] &&
      (a.proves_claim === claim.claim_id || a.product_id === prod);
  });
  if(match.length) return match[0].asset_id;
  /* 3. flag */
  return '';
}

/* ============ MAIN BUILD ============ */
function build(){
  var archId = $('arch').value;
  var arch = ARCHETYPES[archId];
  if(!arch){ ASSIGNED=[]; $('page').innerHTML=''; return }

  var stage = $('aw').value;
  $('archnote').textContent = arch.description || '';
  $('setupsum').textContent = STAGE_LABELS[stage] + ' \u00b7 ' + arch.name;

  /* ---- filter claims by awareness ---- */
  var nHid = 0;
  document.querySelectorAll('#claims .pick').forEach(function(el){
    var c = myClaims().filter(function(x){return x.claim_id===el.dataset.id})[0];
    if(!c) return;
    var why = '';
    if((c.awareness||[]).indexOf(stage) < 0) why = 'not valid at this stage';
    /* listicle_a only accepts reason scope */
    if(archId === 'listicle_a' && c.scope !== 'reason') why = 'listicle needs scope reason';
    el.classList.toggle('off', !!why);
    el.querySelector('.why').textContent = why;
    var b = el.querySelector('input');
    b.disabled = !!why;
    if(why) b.checked = false;
    if(why) nHid++;
    el.hidden = !!why && !SHOWALL;
  });
  var sa = $('showall');
  sa.hidden = !nHid;
  sa.textContent = SHOWALL
    ? 'hide '+nHid+' ineligible'
    : nHid+' claim'+(nHid>1?'s':'')+' not eligible here';

  /* ---- gather checked claims and objections ---- */
  var cl = [], ob = [];
  document.querySelectorAll('#claims input:checked').forEach(function(b){
    myClaims().forEach(function(c){if(c.claim_id===b.value) cl.push(c)});
  });
  document.querySelectorAll('#objs input:checked').forEach(function(b){
    myObjs().forEach(function(o){if(o.objection_id===b.value) ob.push(o)});
  });

  /* ---- rank ---- */
  cl.sort(function(a,b){return b.strength-a.strength || a.claim_id.localeCompare(b.claim_id)});
  ob.sort(function(a,b){return b.severity-a.severity || a.objection_id.localeCompare(b.objection_id)});

  var numSlots = arch.slots.filter(function(s){return s.kind==='numbered'}).length;
  $('ccount').textContent = cl.length + (arch.max_claims ? ' of max '+arch.max_claims : '');
  $('objsum').textContent = ob.length ? ob.length+' selected' : 'none selected';

  /* ---- validate ---- */
  var F = [], hard = false;

  if(!cl.length){
    F.push(['err','No claims','Check at least one claim.']);
    hard = true;
  }
  if(arch.max_claims && cl.length > arch.max_claims){
    F.push(['err','Too many claims',
      'This archetype has '+arch.max_claims+' numbered slots. Uncheck '+(cl.length - arch.max_claims)+'.']);
    hard = true;
  }

  /* warning: fewer claims than numbered slots */
  if(cl.length && cl.length < numSlots){
    var empty = numSlots - cl.length;
    F.push(['warn','Unfilled slots',
      empty+' numbered slot'+(empty>1?'s':'')+' will be empty or disabled.']);
  }

  /* warning: unanswered objections */
  ob.forEach(function(o){
    if(!cl.some(function(c){return (c.kills_objection||[]).indexOf(o.objection_id)>-1})){
      var fix = myClaims().filter(function(c){return (c.kills_objection||[]).indexOf(o.objection_id)>-1});
      F.push(['warn','Doubt left open',
        '"'+esc(o.objection)+'" is raised and never answered.'+
        (fix.length ? ' "'+esc(fix[0].feature)+'" would answer it.' : ' Nothing in the sheet answers it.')]);
    }
  });

  /* warning: more objection slots than claim slots */
  var claimSlotCount = arch.slots.filter(function(s){
    return s.content==='claim'||s.content==='top_claim'||s.content==='claims'||s.content==='close';
  }).length;
  var objSlotCount = arch.slots.filter(function(s){
    return s.content==='objections';
  }).length;
  if(cl.length && ob.length && ob.length > cl.length){
    F.push(['warn','Defensive page','More objections selected than claims.']);
  }

  /* warning: controlling idea vs hero */
  var idea = tokens($('idea').value);
  if(cl.length && idea.length && archId === 'standard'){
    var heroTokens = tokens(cl[0].feature+' '+cl[0].benefit+' '+cl[0].emotion);
    if(!idea.some(function(w){return heroTokens.indexOf(w)>-1}))
      F.push(['warn','Idea and hero disagree',
        'Your controlling idea shares no words with the hero claim. One of the two is wrong.']);
  }

  /* ---- render flags ---- */
  var errs = F.filter(function(f){return f[0]==='err'});
  var warns = F.filter(function(f){return f[0]==='warn'});
  var fh = errs.map(fl).join('');
  if(warns.length){
    fh += '<details class="warns"'+(WOPEN?' open':'')+'>';
    fh += '<summary><span class="ic">?</span><span>'+warns.length+' warning'+
      (warns.length>1?'s':'')+'</span><span class="chev">\u203a</span></summary>';
    fh += warns.map(fl).join('');
    fh += '</details>';
  }
  if(!errs.length && !warns.length){
    fh = fl(['ok','Clean','Nothing to fix.']);
  }
  $('flags').innerHTML = fh;
  var wd = $('flags').querySelector('details.warns');
  if(wd) wd.addEventListener('toggle',function(){WOPEN=wd.open});

  if(hard){
    ASSIGNED = [];
    $('page').innerHTML = '';
    $('meta').textContent = '';
    $('gen').disabled = true;
    $('gnote').textContent = 'Clear the errors';
    $('jsonout').style.display = 'none';
    renderDetail();
    return;
  }

  /* ---- assign content to slots ---- */
  var claimPool = cl.slice();
  var usedAssets = {};
  var disabled = [];
  ASSIGNED = [];

  arch.slots.forEach(function(slot){
    var entry = {
      slot: slot,
      claim_ids: [],
      objection_ids: [],
      asset_id: '',
      _active: true,
      _claims: [],
      _objections: []
    };

    if(slot.kind === 'fixed'){
      /* nothing to assign */
    }
    else if(slot.content === 'controlling_idea'){
      /* native slot, takes controlling idea */
    }
    else if(slot.content === 'none'){
      /* chrome or structural, nothing to assign */
    }
    else if(slot.content === 'top_claim'){
      /* hero on standard: strongest claim */
      if(claimPool.length){
        var c = claimPool.shift();
        entry.claim_ids = [c.claim_id];
        entry._claims = [c];
        entry.asset_id = resolveAsset(c, usedAssets);
        if(entry.asset_id) usedAssets[entry.asset_id] = true;
      }
    }
    else if(slot.content === 'claim' && slot.kind === 'numbered'){
      /* one claim from pool */
      if(claimPool.length){
        var c = claimPool.shift();
        entry.claim_ids = [c.claim_id];
        entry._claims = [c];
        entry.asset_id = resolveAsset(c, usedAssets);
        if(entry.asset_id) usedAssets[entry.asset_id] = true;
      } else {
        entry._active = false;
        disabled.push(slot.key);
      }
    }
    else if(slot.content === 'claim' && slot.kind === 'single'){
      /* single claim slot (image-with-text, etc) */
      if(claimPool.length){
        var c = claimPool.shift();
        entry.claim_ids = [c.claim_id];
        entry._claims = [c];
        entry.asset_id = resolveAsset(c, usedAssets);
        if(entry.asset_id) usedAssets[entry.asset_id] = true;
      }
    }
    else if(slot.content === 'claims'){
      /* repeater: all remaining claims */
      entry.claim_ids = claimPool.map(function(c){return c.claim_id});
      entry._claims = claimPool.slice();
      claimPool = [];
    }
    else if(slot.content === 'objections'){
      /* repeater: all checked objections */
      entry.objection_ids = ob.map(function(o){return o.objection_id});
      entry._objections = ob.slice();
    }
    else if(slot.content === 'close'){
      /* close slot: reuse the strongest claim (hero) for restating */
      if(cl.length){
        entry.claim_ids = [cl[0].claim_id];
        entry._claims = [cl[0]];
        entry.asset_id = resolveAsset(cl[0], usedAssets);
        if(entry.asset_id) usedAssets[entry.asset_id] = true;
      }
    }

    ASSIGNED.push(entry);
  });

  /* ---- warning: missing images ---- */
  var noimg = ASSIGNED.filter(function(a){
    return a._active && a.slot.needs_media && !a.asset_id &&
      a.slot.kind !== 'fixed' && a.slot.content !== 'none';
  }).length;
  if(noimg){
    /* re-render flags with image warning */
    F.push(['warn','Missing images',noimg+' slot'+(noimg>1?'s need':' needs')+' an image.']);
    warns = F.filter(function(f){return f[0]==='warn'});
    fh = errs.map(fl).join('');
    if(warns.length){
      fh += '<details class="warns"'+(WOPEN?' open':'')+'>';
      fh += '<summary><span class="ic">?</span><span>'+warns.length+' warning'+
        (warns.length>1?'s':'')+'</span><span class="chev">\u203a</span></summary>';
      fh += warns.map(fl).join('');
      fh += '</details>';
    }
    $('flags').innerHTML = fh;
    wd = $('flags').querySelector('details.warns');
    if(wd) wd.addEventListener('toggle',function(){WOPEN=wd.open});
  }

  /* ---- build output shape ---- */
  var outSlots = {};
  ASSIGNED.forEach(function(a){
    if(a.slot.kind === 'fixed') return;
    if(a.slot.kind === 'native') return;
    var s = { kind: a.slot.kind, copy: {} };
    if(a.claim_ids.length) s.claim_ids = a.claim_ids;
    if(a.objection_ids.length) s.objection_ids = a.objection_ids;
    if(a.slot.needs_media) s.asset_id = a.asset_id || '';
    outSlots[a.slot.key] = s;
  });

  OUTPUT = {
    archetype: archId,
    product_id: $('prod').value,
    awareness: stage,
    controlling_idea: $('idea').value,
    page: { title: null, content: null },
    slots: outSlots,
    disabled: disabled,
    flags: F.map(function(f){return {level:f[0],title:f[1],message:f[2]}})
  };

  /* ---- render ---- */
  renderPage();
  var activeCount = ASSIGNED.filter(function(a){return a._active && a.slot.kind!=='fixed'}).length;
  $('meta').textContent = activeCount + ' slots';
  $('gen').disabled = false;
  $('gnote').textContent = activeCount + ' prompts, one per slot';
}

/* ---- render page preview ---- */
function renderPage(){
  var html = '<div class="thesis">'+esc($('idea').value||'no controlling idea')+'</div>';
  var idx = 0;

  ASSIGNED.forEach(function(a, i){
    if(a.slot.kind === 'fixed') return;

    idx++;
    var cls = 'sect';
    if(SEL === i) cls += ' sel';
    if(!a._active) cls += ' disabled-slot';

    html += '<div class="'+cls+'" data-i="'+i+'" tabindex="0" role="button">';
    html += '<span class="idx">'+String(idx).padStart(2,'0')+'</span>';
    html += '<span class="slotlabel">'+esc(a.slot.key)+'</span>';
    html += '<span class="kindlabel">'+esc(a.slot.kind)+'</span>';

    if(a.slot.needs_media && !a.asset_id && a._active && a.slot.content !== 'none'){
      html += '<span class="miss">no image</span>';
    }

    html += wire(a.slot);
    html += '</div>';
  });

  $('page').innerHTML = html;

  document.querySelectorAll('.sect').forEach(function(el){
    var go = function(){
      SEL = +el.dataset.i;
      renderPage();
      renderDetail();
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}
    });
  });
}

/* ---- render detail inspector ---- */
function renderDetail(){
  var a = ASSIGNED[SEL];
  if(!a){
    $('dtitle').textContent = 'Slot';
    $('dpos').textContent = '';
    $('detail').innerHTML = '<p class="empty">Click a slot in the page to inspect it.</p>';
    return;
  }
  var s = a.slot;
  $('dtitle').textContent = s.role;
  $('dpos').textContent = s.key;

  /* bound content */
  var bind = '<span style="color:var(--muted)">nothing bound</span>';
  if(a._claims.length === 1){
    var c = a._claims[0];
    bind = '<b>'+esc(c.feature)+'</b>'+
      (c.benefit ? '<br>'+esc(c.benefit) : '')+
      (c.emotion ? '<br><span style="color:var(--muted)">'+esc(c.emotion)+'</span>' : '')+
      (c.proof ? '<br><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">'+esc(c.proof)+'</span>' : '');
  } else if(a._claims.length > 1){
    bind = a._claims.map(function(c){
      return '<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--rule)">'+
        '<b>'+esc(c.feature)+'</b>'+
        (c.benefit ? '<br>'+esc(c.benefit) : '')+'</div>';
    }).join('');
  } else if(a._objections.length){
    bind = a._objections.map(function(o){
      return '<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--rule)">'+
        '<b>'+esc(o.objection)+'</b><br>'+esc(o.rebuttal)+'</div>';
    }).join('');
  } else if(s.content === 'controlling_idea'){
    bind = '<b>'+esc($('idea').value)+'</b>';
  }

  /* image status */
  var imgStatus;
  if(!s.needs_media){
    imgStatus = '<span style="color:var(--muted)">not required</span>';
  } else if(a.asset_id){
    imgStatus = '<span style="font-family:var(--mono);font-size:11.5px">'+esc(a.asset_id)+'</span>';
  } else {
    imgStatus = '<span style="color:var(--amber)">needs one, no asset resolved</span>';
  }

  $('detail').innerHTML =
    '<dl class="kv">'+
      '<dt>Key</dt><dd style="font-family:var(--mono);font-size:12px">'+esc(s.key)+'</dd>'+
      '<dt>Kind</dt><dd>'+esc(s.kind)+'</dd>'+
      '<dt>Section</dt><dd style="font-family:var(--mono);font-size:12px">'+esc(s.section_type)+'</dd>'+
      '<dt>Job</dt><dd>'+esc(s.role_intent)+'</dd>'+
      '<dt>Bound</dt><dd>'+bind+'</dd>'+
      '<dt>Image</dt><dd>'+imgStatus+'</dd>'+
    '</dl>'+
    '<details class="slots"><summary>Fields \u00b7 '+
      s.fields.length+'</summary><div style="padding-top:7px">'+
      s.fields.map(function(f){return '<span class="slot">'+f+'</span>'}).join('')+
    '</div></details>';
}

/* ---- show JSON output ---- */
function showOutput(){
  if(!OUTPUT) return;
  var el = $('jsonout');
  el.textContent = JSON.stringify(OUTPUT, null, 2);
  el.style.display = 'block';
}

/* ---- events ---- */
$('showall').addEventListener('click', function(){ SHOWALL = !SHOWALL; build() });
$('prod').addEventListener('change', function(){ SHOWALL=false; paintProduct(); build() });
$('aw').addEventListener('change', function(){ SHOWALL=false; build() });
$('arch').addEventListener('change', function(){ SEL=null; SHOWALL=false; build() });
$('idea').addEventListener('input', build);
$('gen').addEventListener('click', function(){
  showOutput();
  $('gnote').textContent = 'Output below. Each slot goes out separately, then one page pass for repetition.';
});

})();
</script>
</body>
</html>
